{% extends "base.html" %}

{% block title %}Login · ShorlyNot Bank{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card">
    <div class="card-header" style="text-align: center; display: block;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.5rem;">⚛</div>
      <h2 class="card-title">Sign in to ShorlyNot Bank</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
        Quantum Digital Signature Secured Financial Banking
      </p>
    </div>

    {% if error %}
      <div class="alert alert-danger">
        <span>⚠️ {{ error }}</span>
      </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" id="username" name="username" placeholder="e.g. alice" required value="alice">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required value="alice123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Sign In with Quantum Key Auth
      </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
      <p style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.75rem;">
        ⚡ Demo Quick Switcher:
      </p>
      <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
        <button type="button" class="chip demo-user-btn" data-u="alice" data-p="alice123">Alice (₹50k Customer)</button>
        <button type="button" class="chip demo-user-btn" data-u="bob" data-p="bob123">Bob (₹20k Customer)</button>
        <button type="button" class="chip demo-user-btn" data-u="carol" data-p="carol123">Carol (₹10k Customer)</button>
        <button type="button" class="chip demo-user-btn" data-u="eve" data-p="eve123" style="color: var(--danger);">Eve (Attacker)</button>
        <button type="button" class="chip demo-user-btn" data-u="ops" data-p="ops123" style="color: #0284c7;">Ops (SOC Officer)</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
