[project]
name = "shorlynot"
version = "0.1.0"
description = "Quantum-Key-Bound Network Lease Enforcement Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "pyserial>=3.5",
    "cryptography>=44.0.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "qiskit>=2.0.0",
    "qiskit-aer>=0.15.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
ibm = [
    "qiskit-ibm-runtime>=0.34.0",
    "ibm-cloud-sdk-core>=3.0.0",
]
pqc = [
    "liboqs-python>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
