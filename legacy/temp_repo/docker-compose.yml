version: '3.8'
services:
  finquantum-shield:
    build: .
    ports:
      - "8000:8000"
      - "8765:8765"
      - "8501:8501"
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
