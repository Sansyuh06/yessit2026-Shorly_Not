# config.yaml — Single source of truth for all settings
quantum:
  num_qubits: 768
  qber_threshold: 0.11
  noise_epsilon: 0.02
  privacy_amplification_output_bits: 256

network:
  kms_host: "0.0.0.0"
  kms_port: 8000
  chat_port: 8765
  dashboard_port: 8501

escalation:
  ports: [1919, 1920, 1921, 1922, 1923, 1924, 1925]
  ips: ["192.168.1.100", "192.168.1.150"]
  networks: ["192.168.1.0/24", "192.168.2.0/24"]

security:
  hkdf_salt_bytes: 16
  aes_key_bits: 256
  nonce_bytes: 12
  join_token_bytes: 16

ui:
  theme: "dark"
  refresh_interval_seconds: 1
  max_event_log_entries: 200
