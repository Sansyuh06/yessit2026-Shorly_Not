name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: echo "✅ Dependencies installed successfully"
      - run: python -c "from quantum_engine.bb84_simulator import run_bb84_session; print('✅ Core imports work')"
      - run: python -c "from kms.key_management_service import KeyManagementService; print('✅ KMS imports work')"
      - run: echo "✅ CI passed - all core modules loadable"
